version: "3.9"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro # Montar los mismos certificados
    command: --ssl-ca=/etc/mysql/certs/server.crt --ssl-cert=/etc/mysql/certs/server.crt --ssl-key=/etc/mysql/certs/server.key
    ports:
      - "3306:3306"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./api/.env.example  # para desarrollo usamos esto por ahora
  loadbalancer:
    image: nginx:latest
    container_name: loadbalancer
    restart: always
    ports:
      - "80:80"     # HTTP para redirección
      - "443:443"   # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # <--- Carpeta local con tus .crt y .key
      - ./nginx_logs:/var/log/nginx  # Guardar logs en disco local para inspección y Fail2ban
    depends_on:
      - api

  fail2ban:
    build:
      context: ./fail2ban
    container_name: fail2ban
    restart: always
    # NET_ADMIN es necesario para manipular iptables dentro de la pila de red
    cap_add:
      - NET_ADMIN
    # Comparte la misma red del loadbalancer para bloquear tráfico directamente en su entrada
    network_mode: "service:loadbalancer"
    volumes:
      - ./nginx_logs:/var/log/nginx
    depends_on:
      - loadbalancer

  snort:
    build:
      context: ./snort
    container_name: snort
    restart: always
    # NET_ADMIN es necesario para capturar tráfico de red en modo promiscuo (sniffing)
    cap_add:
      - NET_ADMIN
    # Comparte la misma red del loadbalancer para sniffear los paquetes entrantes/salientes
    network_mode: "service:loadbalancer"
    depends_on:
      - loadbalancer

volumes:
  db_data:

