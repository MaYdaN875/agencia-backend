version: "3.9"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_app
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./certs:/etc/mysql/certs:ro # Montar los mismos certificados
    command: --ssl-ca=/etc/mysql/certs/server.crt --ssl-cert=/etc/mysql/certs/server.crt --ssl-key=/etc/mysql/certs/server.key
    ports:
      - "3306:3306"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./api/.env.example  # para desarrollo usamos esto por ahora
  loadbalancer:
    image: nginx:latest
    container_name: loadbalancer
    restart: always
    ports:
      - "80:80"     # HTTP para redirección
      - "443:443"   # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # <--- Carpeta local con tus .crt y .key
    depends_on:
      - api

volumes:
  db_data:
